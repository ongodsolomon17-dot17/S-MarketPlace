# Render Blueprint for the S-Market Place API (optional - you can also create the service by hand).
# The service name below makes the URL https://s-marketplace.onrender.com, which is what
# frontend/js/config.js points to. If Render says the name is taken, change BOTH places.
services:
  - type: web
    name: s-marketplace
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY            # signs login tokens; Render generates a strong random value for you
        generateValue: true
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: FRONTEND_ORIGIN       # your exact Vercel URL, e.g. https://s-marketplace-s-market-place.vercel.app
        sync: false
      - key: PAYSTACK_SECRET_KEY   # Paystack dashboard > Settings > API Keys (sk_test_... or sk_live_...)
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ORDER_HOLD_MINUTES    # how long an unpaid order keeps its items reserved
        value: "30"
